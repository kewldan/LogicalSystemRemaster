<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Logical System</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #16161a;
            color: #d0d0d0;
            font-family: system-ui, sans-serif;
        }

        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            border: 0;
            outline: none;
        }

        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            letter-spacing: 0.5px;
            pointer-events: none;
        }
    </style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<div id="loading">Loading Logical System…</div>
<script>
    var Module = {
        canvas: document.getElementById('canvas'),
        print: function (text) { console.log(text); },
        printErr: function (text) { console.error(text); },
        onRuntimeInitialized: function () {
            var el = document.getElementById('loading');
            if (el) el.remove();
        }
    };
</script>
{{{ SCRIPT }}}
</body>
</html>
