name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to create releases on v* tags

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg binary archives
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-

      - name: Set up vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$env:GITHUB_WORKSPACE\vcpkg"
          & "$env:GITHUB_WORKSPACE\vcpkg\bootstrap-vcpkg.bat"

      - name: Configure
        env:
          VCPKG_ROOT: ${{ github.workspace }}\vcpkg
        run: cmake --preset static

      - name: Build
        run: cmake --build --preset static-release

      - name: Test
        run: ctest --test-dir build-static -C Release --output-on-failure

      - name: Package
        run: Copy-Item build-static/Release/LogicalSystem.exe LogicalSystem-win64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: LogicalSystem-win64
          path: LogicalSystem-win64.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg binary archives
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-macos-${{ runner.arch }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-macos-${{ runner.arch }}-

      - name: Set up vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$GITHUB_WORKSPACE/vcpkg"
          "$GITHUB_WORKSPACE/vcpkg/bootstrap-vcpkg.sh"

      - name: Configure
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: cmake --preset macos

      - name: Build
        run: cmake --build --preset macos-release

      - name: Test
        run: ctest --test-dir build-macos --output-on-failure

      - name: Package
        run: ditto -c -k --sequesterRsrc --keepParent build-macos/LogicalSystem.app LogicalSystem-macos-${{ runner.arch }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: LogicalSystem-macos-${{ runner.arch }}
          path: LogicalSystem-macos-${{ runner.arch }}.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xorg-dev libgl1-mesa-dev libglu1-mesa-dev \
            libgtk-3-dev pkg-config autoconf autoconf-archive automake libtool libltdl-dev

      - name: Cache vcpkg binary archives
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-linux-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-linux-

      - name: Set up vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$GITHUB_WORKSPACE/vcpkg"
          "$GITHUB_WORKSPACE/vcpkg/bootstrap-vcpkg.sh"

      - name: Configure
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: cmake --preset linux

      - name: Build
        run: cmake --build --preset linux-release

      - name: Test
        run: ctest --test-dir build-linux --output-on-failure

      - name: Package
        run: tar -czf LogicalSystem-linux-x64.tar.gz -C build-linux LogicalSystem data

      - uses: actions/upload-artifact@v4
        with:
          name: LogicalSystem-linux-x64
          path: LogicalSystem-linux-x64.tar.gz

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.4

      - name: Configure
        run: emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-web -j

      - name: Package
        run: cd build-web && zip ../LogicalSystem-web.zip index.html index.js index.wasm index.data

      - uses: actions/upload-artifact@v4
        with:
          name: LogicalSystem-web
          path: LogicalSystem-web.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: Logical System ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/**/*.exe
            release/**/*.zip
            release/**/*.tar.gz
