name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg binary archives
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-

      - name: Set up vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$env:GITHUB_WORKSPACE\vcpkg"
          & "$env:GITHUB_WORKSPACE\vcpkg\bootstrap-vcpkg.bat"

      - name: Configure
        env:
          VCPKG_ROOT: ${{ github.workspace }}\vcpkg
        run: cmake --preset default

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        run: |
          New-Item -ItemType Directory package | Out-Null
          Copy-Item build/Release/LogicalSystem.exe package/
          Copy-Item build/Release/*.dll package/
          Copy-Item README.md, LICENSE package/
          Compress-Archive -Path package/* -DestinationPath LogicalSystem-win64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: LogicalSystem-win64
          path: LogicalSystem-win64.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LogicalSystem-win64.zip
